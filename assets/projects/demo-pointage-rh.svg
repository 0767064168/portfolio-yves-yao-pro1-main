<g font-family="Arial"><rect x="322" y="172" width="220" height="112" rx="16" fill="#0e2439"/><text x="345" y="207" fill="#82a4bf" font-size="14">Présents aujourd'hui</text><text x="345" y="258" fill="#fff" font-size="34" font-weight="700">86%</text><text x="452" y="258" fill="#58df9a" font-size="14">+8.4%</text><rect x="564" y="172" width="220" height="112" rx="16" fill="#0e2439"/><text x="587" y="207" fill="#82a4bf" font-size="14">Heures travaillées</text><text x="587" y="258" fill="#fff" font-size="34" font-weight="700">1,248</text><text x="700" y="258" fill="#ffad64" font-size="14">Cette semaine</text><rect x="806" y="172" width="302" height="112" rx="16" fill="#0e2439"/><text x="829" y="207" fill="#82a4bf" font-size="14">Équipe active</text><text x="829" y="258" fill="#fff" font-size="34" font-weight="700">42</text><text x="920" y="258" fill="#82a4bf" font-size="14">collaborateurs</text></g>
