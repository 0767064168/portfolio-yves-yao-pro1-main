<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PointageRH dashboard demo</title>
<desc id="desc">A dark human resources dashboard with attendance metrics and a blue orange chart.</desc>
