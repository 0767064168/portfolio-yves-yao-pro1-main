<rect width="1200" height="760" rx="34" fill="url(#bg)"/><rect x="44" y="42" width="1112" height="676" rx="24" fill="#07111f" stroke="#315879" stroke-width="2"/>
<rect x="44" y="42" width="230" height="676" rx="24" fill="#0a1b2d"/><text x="78" y="103" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Pointage<tspan fill="#ff8a24">RH</tspan></text><circle cx="94" cy="159" r="8" fill="#1aa9ff"/><text x="116" y="167" fill="#d5e9fb" font-family="Arial" font-size="17">Dashboard</text><text x="116" y="224" fill="#7898b4" font-family="Arial" font-size="17">Employés</text><text x="116" y="281" fill="#7898b4" font-family="Arial" font-size="17">Congés</text><text x="116" y="338" fill="#7898b4" font-family="Arial" font-size="17">Rapports</text><rect x="78" y="610" width="140" height="42" rx="12" fill="#123554"/><text x="100" y="637" fill="#8bd7ff" font-family="Arial" font-size="14">Vue équipe</text>
